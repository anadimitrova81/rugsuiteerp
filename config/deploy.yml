# Kamal deploy configuration for RugSuite ERP.
#
# Co-located on the same VPS (93.94.140.141) as nexus-cleaning. Kamal's proxy
# routes by host, so the two apps share the box: distinct `service`, `image`,
# `proxy.host` and a separate Postgres accessory (on a different host port).
#
# Before the first deploy: set .kamal/secrets values in your env, add swap on
# the VPS (a 1-CPU/2GB box OOMs during the on-server image build otherwise),
# and point DNS for the hosts below at 93.94.140.141. Then `bin/kamal setup`
# (first time) or `bin/kamal deploy`.

service: rugsuiteerp
image: anadimitrova81/rugsuiteerp

servers:
  web:
    - 93.94.140.141

# Let's Encrypt SSL via the shared Kamal proxy (HTTP-01). Requires the hosts to
# already resolve to 93.94.140.141 before the first deploy.
#
# NOTE — multi-tenant subdomains: customers live at <slug>.rugsuiteerp.com.
# HTTP-01 can't issue a wildcard cert, so tenant subdomains are NOT served yet
# by this config. Add `*.rugsuiteerp.com` behind a wildcard-TLS proxy
# (e.g. Cloudflare) or a DNS-01 cert as a follow-up; the apex + www below cover
# the marketing/product site.
proxy:
  ssl: true
  host: rugsuiteerp.com,www.rugsuiteerp.com

registry:
  server: ghcr.io
  username: anadimitrova81
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - BUGSY_DATABASE_PASSWORD
    # smsapi.bg + Google Maps keys are read from encrypted credentials.
  clear:
    # Run Solid Queue inside Puma (fine for low volume; split out when we grow).
    SOLID_QUEUE_IN_PUMA: true

    # Kamal puts the Postgres accessory on the internal Docker network at
    # <service>-<accessory> — i.e. `rugsuiteerp` + `db` below.
    DB_HOST: rugsuiteerp-db

    # Leave SMS_LIVE unset until cutting over to the real domain (logs instead
    # of sending). Set to "1" to send live SMS.
    # SMS_LIVE: "1"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent volume for Active Storage uploads. Back this up off-server.
volumes:
  - "rugsuite_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  # Build the image on the VPS itself (no local Docker required).
  remote: ssh://root@93.94.140.141

# Postgres accessory — co-located on the same VPS as nexus-cleaning's Postgres.
# Published on host port 5433 (nexus uses 5432) to avoid a bind conflict; the
# app reaches it over the Docker network as `rugsuiteerp-db:5432`, not the
# published port. Password is shared with BUGSY_DATABASE_PASSWORD via
# .kamal/secrets so the app and DB stay in sync.
accessories:
  db:
    image: postgres:16
    host: 93.94.140.141
    port: "127.0.0.1:5433:5432"
    env:
      clear:
        POSTGRES_USER: bugsy
        POSTGRES_DB: rugsuiteerp_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
