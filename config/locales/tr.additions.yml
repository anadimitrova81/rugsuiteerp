      rights: Haklarınız
      cookies: Çerezler
      contact: Kişisel veriler için iletişim
      changes: Politikadaki değişiklikler
    sections:
      controller:
        heading: 1. Veri sorumlusu
        body_html: "<p>Kişisel verilerinizin sorumlusu, Plovdiv ve hizmet verilen bölgelerde faaliyet gösteren <strong>Example Cleaning</strong>'dir (Example Ltd., UIC: 112641285, Plovdiv, Deacon Ilarion Sok. No: 4).</p>\n"
      data:
        heading: 2. Hangi verileri topluyoruz
        body_html: |
          <p>Bir temizlik siparişini yerine getirmek amacıyla, tarafınızca gönüllü olarak sağlanan aşağıdaki kişisel veri kategorilerini topluyoruz:</p>
          <ul>
            <li><strong>İletişim bilgileri</strong> — telefon numarası ve isteğe bağlı olarak e-posta.</li>
            <li><strong>Adres</strong> — alım ve iade için gerekli olan sokak, numara ve yerleşim yeri.</li>
            <li><strong>Sipariş bilgileri</strong> — istenen alım zamanı, erişim notları, halıların açıklaması.</li>
            <li><strong>Teknik veriler</strong> — siteyi kullanırken otomatik olarak toplanan IP adresi ve tarayıcı bilgileri (bkz. "Çerezler" bölümü).</li>
          </ul>
          <p>Hassas kişisel verileri (sağlık durumu, siyasi görüşler, din vb.) toplamıyoruz.</p>
      purposes:
        heading: 3. İşleme amaçları
        body_html: |
          <p>Verilerinizi aşağıdaki amaçlarla kullanıyoruz:</p>
          <ul>
            <li>İlgili siparişi yerine getirme — alım, temizlik ve iadeyi koordine etme.</li>
            <li>Siparişe ilişkin iletişim — onay, durum bildirimleri, taleplere yanıt verme.</li>
            <li>Hizmetlerimizi iyileştirme — iş yükü ve hizmet verilen bölgelere ilişkin istatistikleri analiz etme.</li>
          </ul>
      legal_basis:
        heading: 4. Yasal dayanak
        body_html: |
          <p>Kişisel verilerinizi aşağıdaki dayanaklarla işliyoruz:</p>
          <ul>
            <li><strong>Sözleşmenin ifası</strong> — siparişinizi işleme almak için.</li>
            <li><strong>Meşru menfaat</strong> — hizmeti iyileştirmek ve kötüye kullanımı önlemek için.</li>
          </ul>
      sharing:
        heading: 5. Üçüncü taraflarla paylaşım
        body_html: |
          <p>Verilerinizi satmıyoruz. Yalnızca aşağıdakilerle paylaşabiliriz:</p>
          <ul>
            <li>Kuryelerimiz (çalışanlar veya taşeronlar) — halıların alımı ve iadesi için.</li>
            <li>Devlet kurumları — yalnızca yasaların gerektirdiği durumlarda.</li>
          </ul>
      retention:
        heading: 6. Saklama süreleri
        body_html: |
          <p>Verilerinizi yalnızca amaçlarına ulaşmak için gerekli olan süre boyunca saklarız:</p>
          <ul>
            <li>Sipariş verileri — ifa süresi boyunca ve şikâyetler için ek bir süre.</li>
            <li>Teknik günlükler — genellikle 12 aya kadar.</li>
          </ul>
      security:
        heading: 7. Veri güvenliği
        body_html: "<p>Verilerinizi korumak için organizasyonel ve teknik önlemler uyguluyoruz: yalnızca bilgiye ihtiyaç duyan çalışanlar için erişim, verilerin site üzerinden şifreli iletimi (HTTPS) ve düzenli yedeklemeler. Yine de hiçbir sistem tamamen dokunulmaz değildir; herhangi bir kötüye kullanımdan şüphelenirseniz derhal bildirmenizi rica ederiz.</p>\n"
      rights:
        heading: 8. Haklarınız
        body_html: |
          <p>GDPR kapsamında şu haklara sahipsiniz:</p>
          <ul>
            <li><strong>Erişim</strong> — hangi verilerinizi işlediğimize dair bilgi edinme.</li>
            <li><strong>Düzeltme</strong> — yanlış veya eksik verilerin düzeltilmesini isteme.</li>
            <li><strong>Silme</strong> — saklamak için yasal bir yükümlülüğümüz olmadığı durumlarda verilerin silinmesini isteme.</li>
            <li><strong>Kısıtlama</strong> — işlemenin kısıtlanmasını isteme.</li>
            <li><strong>Taşınabilirlik</strong> — verilerinizi yapılandırılmış, makinece okunabilir bir biçimde alma.</li>
            <li><strong>İtiraz</strong> — meşru menfaate dayalı işlemeye itiraz etme.</li>
            <li><strong>Şikâyet</strong> — Kişisel Verilerin Korunması Komisyonu'na (CPDP) şikâyette bulunma.</li>
          </ul>
      cookies:
        heading: 9. Çerezler
        body_html: "<p>Site, yalnızca temel işleyişi için gerekli çerezleri kullanır (örneğin yönetici paneline giriş yaparken oturumu sürdürmek için). Üçüncü taraflardan reklam veya takip çerezleri kullanmıyoruz.</p>\n"
      contact:
        heading: 10. Kişisel veriler için iletişim
        body_html: |
          <p>Verilerinizin işlenmesiyle ilgili sorularınız varsa veya haklarınızdan herhangi birini kullanmak isterseniz bizimle iletişime geçin:</p>
          <ul>
            <li>Telefon: <a href="tel:+359899771972">+359 899 771 972</a></li>
            <li>E-posta: <a href="mailto:office@example.com">office@example.com</a></li>
          </ul>
          <p>Talebinizi aldıktan sonraki bir ay içinde yanıt vereceğiz.</p>
      changes:
        heading: 11. Politikadaki değişiklikler
        body_html: "<p>Uygulamalarımız veya yasal gereklilikler değiştiğinde bu politikayı güncelleyebiliriz. Güncel sürüm, son güncelleme tarihiyle birlikte her zaman bu adreste yayımlanır. Önemli değişiklikler durumunda sizi uygun bir şekilde bilgilendireceğiz (örneğin sitede bir bildirimle veya e-postayla).</p>\n"
  terms:
    meta_title: Hizmet Koşulları · Example Cleaning
    eyebrow: Belge
    title: Hizmet Koşulları
    subtitle: Example Cleaning hizmetlerinin kullanımına ilişkin koşullar.
    updated: 'Son güncelleme: %{date}.'
    toc_heading: İçindekiler
    toc:
      scope: Kapsam ve taraflar
      services: Hizmetler
      orders: Siparişler ve onay
      pricing: Fiyatlar ve ödemeler
      pickup: Alım ve iade
      timing: Teslim süreleri
      liability: Sorumluluk ve zararlar
      cancellation: Sipariş iptali
      complaints: Şikâyetler
      privacy: Kişisel veriler
      changes: Koşullardaki değişiklikler
      disputes: Uygulanacak hukuk ve uyuşmazlıklar
    sections:
      scope:
        heading: 1. Kapsam ve taraflar
        body_html: '<p>Bu hizmet koşulları, <strong>Example Cleaning</strong> (Example Ltd., UIC: 112641285, Plovdiv, Deacon Ilarion Sok. No: 4, bundan böyle "Sağlayıcı") ile <strong>example.com</strong> web sitesi üzerinden, telefonla veya mesajla hizmet sipariş eden gerçek veya tüzel kişiler ("Müşteri" olarak anılır) arasındaki ilişkiyi düzenler.</p>

          '
      services:
        heading: 2. Hizmetler
        body_html: "<p>Sağlayıcı; halıların, yollukların, battaniyelerin, geleneksel yorganların ve nevresimlerin makinede temizliğini, Plovdiv ve hizmet verilen bölgelerde ücretsiz alım ve iade dahil olmak üzere sunar. Süreç; çırpma, yıkama, sıkarak kurutma, fırçalama, koku giderme ve paketlemeyi içerir.</p>\n"
      orders:
        heading: 3. Siparişler ve onay
        body_html: |
          <p>Bir sipariş, sitedeki talep formu aracılığıyla çevrimiçi olarak, telefonla veya belirtilen iletişim bilgileri kullanılarak mesajla verilebilir. Talebi aldıktan sonra Sağlayıcı, alım zamanını onaylamak için Müşteri ile iletişime geçer.</p>
          <p>Sözleşme, belirli alım zamanı ve adresi onaylandığında akdedilmiş sayılır.</p>
      pricing:
        heading: 4. Fiyatlar ve ödemeler
        body_html: |
          <p>Güncel fiyatlar, sitenin ana sayfasında yayımlanır. Halı, yolluk ve battaniye fiyatları, Sağlayıcının tesisinde kalibre edilmiş elektronik bir teraziyle ölçülen ağırlığa göre belirlenir. Yorgan fiyatları adet başınadır.</p>
          <p>Ödeme, teslimatta — nakit veya banka kartıyla — yapılır. Ödemeden sonra Müşteri, benzersiz bir referans numarası içeren bir makbuz alır.</p>
      pickup:
        heading: 5. Alım ve iade
        body_html: |
          <p>Sağlayıcının kuryeleri, alım ve iadeyi önceden yapılan mutabakatla 18:00 ile 20:30 arasındaki zaman aralığında gerçekleştirir. Hizmet verilen bölgelerde taşıma ücretsizdir.</p>
          <p>Müşteri, halıların kararlaştırılan zamanda bizzat veya görevlendirdiği bir kişi aracılığıyla teslimini sağlar.</p>
      timing:
        heading: 6. Teslim süreleri
        body_html: "<p>Standart teslim süresi, alım tarihinden itibaren 3 – 5 iş günüdür. Yoğun dönemlerde, özel kumaşlar için veya öngörülemeyen durumlarda süre 7 iş gününe kadar uzayabilir. Sağlayıcı, Müşteriyi gerçek iade tarihi hakkında bilgilendirir.</p>\n"
      liability:
        heading: 7. Sorumluluk ve zararlar
        body_html: |
          <p>Sağlayıcı, her ürünü işlerken profesyonel özen gösterir. Standart temizlik sırasında hasara yol açabilecek gizli kusurlar, aşınma veya özel nitelikler tespit edilirse Sağlayıcı, Müşteriyi önceden bilgilendirir ve izlenecek yol konusunda mutabık kalınır.</p>
          <p>Hasarlı veya kayıp bir ürün için azami tazminat tutarı, ürünün durumuna ve hasarın niteliğine bağlı olarak 50,00 €'ya (97,79 BGN) kadardır.</p>
      cancellation:
        heading: 8. Sipariş iptali
        body_html: "<p>Müşteri, halılar alınmadan önce bir siparişi ücretsiz olarak iptal edebilir.</p>\n"
      complaints:
        heading: 9. Şikâyetler
        body_html: |
          <p>Müşteri, halıların iadesinden itibaren <em>14</em> gün içinde hizmet kalitesi hakkında şikâyette bulunma hakkına sahiptir. Şikâyet, sorunun bir açıklamasıyla birlikte telefon veya e-postayla iletilir.</p>
          <p>Sağlayıcı, şikâyeti 30 gün içinde inceler ve bir çözüm önerir — yeniden temizleme, düzeltme veya kısmi geri ödeme.</p>
      privacy:
        heading: 10. Kişisel veriler
        body_before: Müşterinin kişisel verilerinin işlenmesi,
        link_text: Gizlilik Politikası
        body_after: " uyarınca gerçekleştirilir; bu politika, bu hizmet koşullarının ayrılmaz bir parçasını oluşturur."
      changes:
        heading: 11. Koşullardaki değişiklikler
        body_html: "<p>Sağlayıcı, bu hizmet koşullarını değiştirme hakkını saklı tutar. Güncel sürüm, son güncelleme tarihiyle birlikte her zaman bu adreste yayımlanır. Değişiklikler, yayımlandıkları tarihten itibaren yürürlüğe girer ve hâlihazırda onaylanmış siparişleri etkilemez.</p>\n"
      disputes:
        heading: 12. Uygulanacak hukuk ve uyuşmazlıklar
        body_html: |
          <p>Bu hizmet koşullarına Bulgaristan hukuku uygulanır. Uyuşmazlıklar karşılıklı mutabakatla, bunun mümkün olmadığı durumlarda ise yetkili Bulgaristan mahkemesi önünde çözülür.</p>
          <p>Bu koşullarla ilgili konularda bizimle <a href="tel:+359899771972">+359 899 771 972</a> numaralı telefondan veya <a href="mailto:office@example.com">office@example.com</a> e-posta adresinden iletişime geçebilirsiniz.</p>
  marketing:
    home:
      page_title: RugSuite ERP — halı yıkama işletmeleri için yazılım
      hero_eyebrow: Halı yıkama işletmeleri için operasyon yazılımı
      hero_title: Halı yıkama işletmenizi dijitalleştirin
      hero_subtitle: RugSuite ERP; elektronik tabloları, kâğıt fişleri ve telefon trafiğini, siparişten teslimata her adımı yöneten tek bir platformla değiştirir — ister tek işletme, ister yüz işletme olsun.
      start_free_trial: Ücretsiz başlayın
      hero_see_how: Nasıl çalıştığını görün
      hero_bullet_1: Çok kiracılı — şirket başına bir platform, alt alan başına bir şirket
      hero_bullet_2: İşletme başına fiyatlandırma, para birimleri, diller ve hizmet bölgeleri
      hero_bullet_3: Rails 8 + Postgres üzerine kurulu — tamamen bizim tarafımızdan barındırılır ve yönetilir
      status_picked_up: Alındı
      status_in_wash: Yıkanıyor
      status_ready: Teslimata hazır
      hero_card_pickup_meta: 5 halı · 23,8 kg · Acme Carpets
      hero_card_wash_meta: 'Tambur 3 · Program: Yün · THS 16:40'
      hero_card_delivery_meta: 'Kurye: Marko · rotada 7 durak'
      features_eyebrow: Neler elde edersiniz
      features_title: Bir halı yıkama işletmesinin ihtiyaç duyduğu her şey, gereksiz hiçbir şey olmadan
      features_lede: Halı yıkama iş akışı için özel olarak tasarlandı. Genel amaçlı CRM zorlamaları yok, ERP şişkinliği yok.
      feature_routing_title: Alım ve teslimat rotalaması
      feature_routing_body: Müşteriler çevrimiçi sipariş verir. Kuryeler bugünün duraklarını en uygun sırada görür, alımı onaylamak için kaydırır, bir fotoğraf çeker, tamamdır. Adresleri telefona bağırmaya son.
      feature_workflow_title: İzlenen yıkama iş akışı
      feature_workflow_body: Her halı beklemede → alındı → yıkanıyor → hazır → teslim edildi aşamalarından geçer. Operatörler binada ne olduğunu görür. Koordinatörler gecikeni görür. Halı hazır olduğunda müşteriler bir SMS alır.
      feature_pricing_title: İşletmenize uygun fiyatlandırma
      feature_pricing_body: Kilogram başına, adet başına, toplu indirimler, faturayla ödeme, ücretsiz alım bölgeleri — bir kez yapılandırın, her yerde uygulayın. İlk günden itibaren çoklu para birimi.
      feature_notifications_title: Müşteri bildirimleri
      feature_notifications_body: Sipariş onayları, fiyat teklifleri, "halınız hazır" uyarıları — müşterinin kendi dilinde SMS ile otomatikleştirilir. Siz peşinden koşmayı, müşteriler aramayı bırakır.
      feature_reports_title: Ofisin gerçekten okuduğu raporlar
      feature_reports_body: Günlük sipariş alımı, haftaya göre gelir, kurye performansı, kayıp sinyalleri. Sade grafikler, CSV'ye aktarılabilir. Veri gölü gerekmez.
      feature_roles_title: Roller ve veri izolasyonu
      feature_roles_body: Yönetici, koordinatör, operatör, kurye — her rol yalnızca ihtiyaç duyduğunu görür. Her işletmenin verisi katı biçimde izole edilir; işletmeler arasında hiçbir şey sızmaz.
