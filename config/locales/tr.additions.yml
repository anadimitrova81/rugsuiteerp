  privacy:
    meta_title: Gizlilik Politikası · Example Cleaning
    eyebrow: Belge
    title: Gizlilik Politikası
    subtitle: Müşterilerimizin kişisel verilerini nasıl işlediğimiz ve koruduğumuz.
    updated: 'Son güncelleme: %{date}.'
    toc_heading: İçindekiler
    toc:
      controller: Veri sorumlusu
      data: Hangi verileri topluyoruz
      purposes: İşleme amaçları
      legal_basis: Yasal dayanak
      sharing: Üçüncü taraflarla paylaşım
