      faq:
        q1: RugSuite ERP nedir?
        a1: RugSuite ERP, halı yıkama işletmeleri için hepsi bir arada bir platformdur. Çevrimiçi sipariş, alma ve teslimat rota optimizasyonu, yıkama akışı, fiyatlandırma, faturalandırma ve otomatik müşteri SMS'lerini kapsar — hepsi kendi markalı alt alan adınızda.
        q2: Ücretsiz bir plan var mı?
        a2: Evet. Free planı ayda 0 €'dur ve 5 kullanıcıyla ayda 30 siparişe kadar kapsar — kredi kartı gerekmez. Ücretli planlar (Starter ve Pro) daha yüksek limitler ve günde daha fazla rota optimizasyonu ekler.
        q3: Bir şey kurmam gerekiyor mu?
        a3: Hayır. RugSuite ERP tamamen tarayıcıda çalışır. Her işletme kendi markalı alt alan adını alır — siz ve müşterileriniz yalnızca bir bağlantı açarsınız.
        q4: Müşterilerim çevrimiçi sipariş verebilir mi?
        a4: Evet. Müşteriler herkese açık sayfanızda sipariş verir, adres Google Maps ile doğrulanır ve bir alma zaman aralığı seçerler. Yerinde veya telefonla gelen siparişleri kendiniz de ekleyebilirsiniz.
        q5: Müşterilere SMS bildirimi gönderir mi?
        a5: Evet — fiyat teklifleri otomatik olarak SMS ile gönderilir, böylece müşteri hizmetin hacmini ve fiyatını öğrenir.
        q6: Hangi dilleri destekliyor?
        a6: Platform İngilizce, Bulgarca, Fransızca, Türkçe, Makedonca ve Sırpça olarak sunulur ve ziyaretçinin dilini otomatik olarak algılar.
