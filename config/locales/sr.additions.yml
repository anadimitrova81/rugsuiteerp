    sections:
      controller:
        heading: 1. Руковалац подацима
        body_html: "<p>Руковалац вашим личним подацима је <strong>Nexus Cleaning</strong> (Nexus Ltd., ЈИБ: 112641285, Пловдив, ул. Ђакона Иларионa 4), који послује на подручју Пловдива и услуженим насељима.</p>\n"
      data:
        heading: 2. Које податке прикупљамо
        body_html: |
          <p>Ради испуњења поруджбине чишћења прикупљамо следеће категорије личних података, које нам добровољно дајете:</p>
          <ul>
            <li><strong>Контакт подаци</strong> — број телефона и опционо е-пошта.</li>
            <li><strong>Адреса</strong> — улица, број и насеље, потребни за преузимање и повратак.</li>
            <li><strong>Подаци о поруджбини</strong> — жељено време преузимања, напомене о приступу, опис тепиха.</li>
            <li><strong>Технички подаци</strong> — IP адреса и информације о прегледачу, које се прикупљају аутоматски приликом коришћења сајта (погледајте одељак „Колачићи“).</li>
          </ul>
          <p>Не прикупљамо осетљиве личне податке (здравствено стање, политичка уверења, вероисповест итд.).</p>
      purposes:
        heading: 3. Сврхе обраде
        body_html: |
          <p>Ваше податке користимо у следеће сврхе:</p>
          <ul>
            <li>Испуњење конкретне поруджбине — координација преузимања, чишћења и повратка.</li>
            <li>Комуникација у вези са поруджбином — потврда, обавештења о статусу, одговори на упите.</li>
            <li>Побољшање наших услуга — анализа статистике оптерећења и услужених подручја.</li>
          </ul>
      legal_basis:
        heading: 4. Правни основ
        body_html: |
          <p>Ваше личне податке обрађујемо на следећим основама:</p>
          <ul>
            <li><strong>Извршење уговора</strong> — да бисмо обрадили вашу поруджбину.</li>
            <li><strong>Легитимни интерес</strong> — да бисмо побољшали услугу и спречили злоупотребе.</li>
          </ul>
      sharing:
        heading: 5. Дељење са трећим лицима
        body_html: |
          <p>Не продајемо ваше податке. Можемо их поделити само са:</p>
          <ul>
            <li>Нашим куририма (запосленима или подизвођачима) — ради преузимања и повратка тепиха.</li>
            <li>Државним органима — само када то захтева закон.</li>
          </ul>
      retention:
        heading: 6. Периоди чувања
        body_html: |
          <p>Ваше податке чувамо само током периода потребног за постизање њихових сврха:</p>
          <ul>
            <li>Подаци о поруджбини — за време испуњења и додатни период за рекламације.</li>
            <li>Технички записи — обично до 12 месеци.</li>
          </ul>
      security:
        heading: 7. Безбедност података
        body_html: "<p>Примењујемо организационе и техничке мере за заштиту ваших података: приступ само за запослене којима су информације потребне, шифровани пренос података преко сајта (HTTPS) и редовне резервне копије. Ипак, ниједан систем није потпуно неповредив, па вас молимо да одмах пријавите ако посумњате на било какву злоупотребу.</p>\n"
      rights:
        heading: 8. Ваша права
        body_html: |
          <p>На основу GDPR-а имате право на:</p>
          <ul>
            <li><strong>Приступ</strong> — да добијете информације о томе које ваше податке обрађујемо.</li>
            <li><strong>Исправку</strong> — да затражите исправку нетачних или непотпуних података.</li>
            <li><strong>Брисање</strong> — да затражите брисање података, осим када имамо законску обавезу да их чувамо.</li>
            <li><strong>Ограничење</strong> — да затражите ограничење обраде.</li>
            <li><strong>Преносивост</strong> — да добијете своје податке у структурисаном, машински читљивом формату.</li>
            <li><strong>Приговор</strong> — да уложите приговор на обраду засновану на легитимном интересу.</li>
            <li><strong>Жалбу</strong> — да поднесете жалбу Комисији за заштиту личних података.</li>
          </ul>
      cookies:
        heading: 9. Колачићи
        body_html: "<p>Сајт користи само колачиће неопходне за његово основно функционисање (на пример, за одржавање сесије приликом пријаве у административни панел). Не користимо рекламне или праћеће колачиће трећих лица.</p>\n"
      contact:
        heading: 10. Контакт за личне податке
        body_html: |
          <p>Ако имате питања о обради ваших података или желите да остварите неко од својих права, контактирајте нас:</p>
          <ul>
            <li>Телефон: <a href="tel:+359899771972">+359 899 771 972</a></li>
            <li>Е-пошта: <a href="mailto:office@nexus-cleaning.com">office@nexus-cleaning.com</a></li>
          </ul>
          <p>На ваш упит одговорићемо у року од месец дана од његовог пријема.</p>
      changes:
        heading: 11. Измене политике
        body_html: "<p>Ову политику можемо ажурирати када се промене наше праксе или законски захтеви. Тренутна верзија је увек објављена на овој адреси са датумом последњег ажурирања. У случају значајних измена, обавестићемо вас на одговарајући начин (на пример, обавештењем на сајту или путем е-поште).</p>\n"
  terms:
    meta_title: Услови коришћења · Nexus Cleaning
    eyebrow: Документ
    title: Услови коришћења
    subtitle: Услови за коришћење услуга Nexus Cleaning.
