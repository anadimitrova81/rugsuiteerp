      stains:
        q: Шта ако имам мрље због којих бринем?
        a_html: Реците нам унапред каква је мрља и колико је стара. Мрље третирамо као <strong>део стандардног прања, без додатне наплате</strong>. У већини случајева резултат надмашује очекивања. Не можемо гарантовати уклањање веома старих или специфичних мрља (на пример мастило или боја).
        a: Реците нам унапред каква је мрља и колико је стара. Мрље третирамо као део стандардног прања, без додатне наплате. Не можемо гарантовати уклањање веома старих или специфичних мрља (на пример мастило или боја).
      safety:
        q: Да ли је безбедно за децу и кућне љубимце?
        a_html: Да. Користимо <strong>биоразградиве, хипоалергене детерџенте</strong> без агресивних хемикалија. Безбедно за осетљиву кожу, малу децу и домове са кућним љубимцима.
        a: Да. Користимо биоразградиве, хипоалергене детерџенте без агресивних хемикалија. Безбедно за осетљиву кожу, малу децу и домове са кућним љубимцима.
      not_home:
        q: Шта ако нисам код куће у време преузимања?
        a_html: Јавите се — лако можемо померити преузимање на други дан, или можете оставити тепих код договореног лица (комшије, портира или члана породице). И повратак се договара унапред тако да не пропустимо термин.
        a: Јавите се — лако можемо померити преузимање на други дан, или можете оставити тепих код договореног лица (комшије, портира или члана породице). И повратак се договара унапред.
      frequency:
        q: Колико често треба прати тепихе?
        a_html: Препоручујемо професионално прање <strong>једном на сваких 12 – 18 месеци</strong> за кућну употребу, и <strong>на сваких 6 – 12 месеци</strong> ако имате кућне љубимце или малу децу. Између прања, редовно истресање и усисавање продужавају век тепиха.
        a: Препоручујемо професионално прање једном на сваких 12 – 18 месеци за кућну употребу, и на сваких 6 – 12 месеци ако имате кућне љубимце или малу децу.
