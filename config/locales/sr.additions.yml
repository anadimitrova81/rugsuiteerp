      privacy: Лични подаци
      changes: Измене услова
      disputes: Меродавно право и спорови
    sections:
      scope:
        heading: 1. Обим и стране
        body_html: '<p>Ови услови коришћења уређују однос између <strong>Nexus Cleaning</strong> (Nexus Ltd., ЈИБ: 112641285, Пловдив, ул. Ђакона Иларионa 4, у даљем тексту „Пружалац“) и физичких или правних лица која поручују услуге (наведених као „Клијент“) преко веб-сајта <strong>nexus-cleaning.com</strong>, телефоном или поруком.</p>

          '
      services:
        heading: 2. Услуге
        body_html: "<p>Пружалац нуди машинско чишћење тепиха, стаза, ћебади, традиционалних јоргана и прекривача, укључујући бесплатно преузимање и повратак у Пловдиву и услуженим насељима. Процес обухвата отпрашивање, прање, центрифугирање, чешљање, дезодорисање и паковање.</p>\n"
      orders:
        heading: 3. Поруджбине и потврда
        body_html: |
          <p>Поруджбина се може направити онлајн преко формулара захтева на сајту, телефоном или поруком помоћу наведених контаката. Након пријема захтева, Пружалац контактира Клијента ради потврде времена преузимања.</p>
          <p>Уговор се сматра закљученим када се потврде конкретно време преузимања и адреса.</p>
      pricing:
        heading: 4. Цене и плаћања
        body_html: |
          <p>Тренутне цене су објављене на почетној страници сајта. Цене за тепихе, стазе и ћебад одређују се по тежини, мереној калибрисаном електронском вагом у објекту Пружаоца. Цене за јоргане су по комаду.</p>
          <p>Плаћање се врши при испоруци — готовином или банковном картицом. Након плаћања, Клијент добија рачун са јединственим референтним бројем.</p>
      pickup:
        heading: 5. Преузимање и повратак
        body_html: |
          <p>Курири Пружаоца обављају преузимање и повратак у термину између 18:00 и 20:30, уз претходни договор. Превоз је бесплатан у оквиру услужених насеља.</p>
          <p>Клијент обезбеђује предају тепиха у договорено време лично или преко одређеног лица.</p>
      timing:
        heading: 6. Рокови израде
        body_html: "<p>Стандардни рок израде је 3 – 5 радних дана од датума преузимања. У периодима веће гужве, за специфичне тканине или у непредвиђеним околностима, рок се може продужити на 7 радних дана. Пружалац обавештава Клијента о стварном датуму повратка.</p>\n"
      liability:
        heading: 7. Одговорност и штете
        body_html: |
          <p>Пружалац примењује професионалну пажњу при обради сваког предмета. Ако се утврде скривени недостаци, похабаност или специфичне карактеристике које би могле довести до оштећења током стандардног чишћења, Пружалац унапред обавештава Клијента и договара даљи ток поступања.</p>
          <p>Максимални износ накнаде за оштећени или изгубљени предмет је до €50,00 (97,79 BGN), у зависности од стања предмета и природе оштећења.</p>
      cancellation:
        heading: 8. Отказивање поруджбине
        body_html: "<p>Клијент може отказати поруджбину пре преузимања тепиха, бесплатно.</p>\n"
      complaints:
        heading: 9. Рекламације
        body_html: |
          <p>Клијент има право да поднесе рекламацију о квалитету услуге у року од <em>14</em> дана од повратка тепиха. Рекламација се подноси телефоном или е-поштом, уз опис проблема.</p>
          <p>Пружалац разматра рекламацију у року од 30 дана и предлаже решење — поновно чишћење, исправку или делимичан повраћај новца.</p>
      privacy:
        heading: 10. Лични подаци
        body_before: Обрада личних података Клијента врши се у складу са
        link_text: Политиком приватности
        body_after: ", која чини саставни део ових услова коришћења."
      changes:
        heading: 11. Измене услова
        body_html: "<p>Пружалац задржава право да измени ове услове коришћења. Тренутна верзија је увек објављена на овој адреси са датумом последњег ажурирања. Измене ступају на снагу од датума објаве и не утичу на већ потврђене поруджбине.</p>\n"
      disputes:
        heading: 12. Меродавно право и спорови
        body_html: |
          <p>На ове услове коришћења примењује се бугарско право. Спорови се решавају споразумно, а када то није могуће — пред надлежним бугарским судом.</p>
          <p>За контакт по питањима везаним за ове услове можете нас добити телефоном на <a href="tel:+359899771972">+359 899 771 972</a> или е-поштом на <a href="mailto:office@nexus-cleaning.com">office@nexus-cleaning.com</a>.</p>
