  home:
    title: "Пране на килими и тепихи в Пловдив"
    hero:
      eyebrow: "Безплатно вземане и връщане в Пловдив и региона"
      title: "Чисти килими — без усилие."
      subtitle: "Взимаме килимите ви след работно време, перем ги машинно с грижа към всяко влакно и ви ги връщаме свежи и пакетирани — отново след работно време. Вие си стоите вкъщи, ние правим останалото."
      cta_book: "Заявка"
      cta_status: "Провери поръчка"
      bullets:
        - "Вземане и връщане между %{pickup_window}"
        - "Безплатен транспорт в Пловдив и региона"
        - "Плащане с карта или в брой"
      chip_steps: "стъпки"
      chip_eco_title: "Eco"
      chip_eco_sub: "биоразградими"
    why_us:
      eyebrow: "Защо нас"
      heading: "Удобно за вас"
      lede: "Малките детайли, които правят разликата между поредната покупка и услуга, на която разчитате."
      feature_1:
        title: "Безплатно вземане и връщане"
        body: "Куриерите ни идват между %{pickup_window} — след работно време. Връщаме килимите ви по същото време, за да не нарушаваме деня ви."
        tag: "%{pickup_window} · всеки ден"
      feature_2:
        title: "Екологично пране"
        body: "Биоразградими препарати и пестелив разход на вода. Безопасно за деца, домашни любимци и стари семейни килими."
        tag: "100%% биоразградими"
      feature_3:
        title: "Удобни плащания"
        body: "Плащате с карта или в брой при доставка. Получавате касова бележка с уникален референтен номер за лесно проследяване."
        tag: "Карта · в брой"
    how_it_works:
      eyebrow: "Как работи"
      heading: "Шест стъпки до чист килим"
      step_label: "Стъпка %{n} / 06"
      step_1:
        title: "Безплатно взимане и връщане"
        body: "Куриерите ни идват пред вратата ви между %{pickup_window}. Взимаме килимите и ги връщаме след пране — отново след работно време. Без транспортни такси."
      step_2:
        title: "Изтупване"
        body: "Извличаме сухия прах, пясъка и космите преди мокро пране, за да не се превърнат в кал при изпирането."
      step_3:
        title: "Изпиране"
        body: "Машинно пране с биоразградими препарати. Дълбоко почистване, без агресивни химикали."
      step_4:
        title: "Центрофугиране"
        body: "Изваждаме излишната вода чрез центрофуга, за да съкратим времето за съхнене и да съхраним формата на килима."
      step_5:
        title: "Разресване"
        body: "Връщаме формата и пухкавостта на влакната, за да изглежда килимът свеж и обемен."
      step_6:
        title: "Ароматизиране и опаковане"
        body: "Лек, ненатрапчив аромат и грижливо опаковане за транспорт и съхранение до доставката пред вратата ви."
    pricing:
      eyebrow: "Цени"
      heading: "Прозрачни цени, без скрити такси"
      duvets_title: "Одеала, китеници"
      duvets_price_html: "<span class='home-pricing-amount-num'>%{price}</span> <span class='home-pricing-unit'>%{currency} / кг</span>"
      duvets_note: "Над %{threshold} кг — %{bulk_price} %{currency} / кг"
      carpets_title: "Килими, пътеки"
      carpets_badge: "Най-поръчвано"
      quilts_title: "Олекотени завивки"
      quilts_price_html: "<span class='home-pricing-amount-num'>%{price}</span> <span class='home-pricing-unit'>%{currency} / бр</span>"
    cta:
      heading: "Готови за чисти килими?"
      subtitle: "Подайте заявка сега и ще сме пред вратата ви скоро."
      button: "Заявка"
    welcome:
      title: "Добре дошли в %{name}!"
      back: "Назад"
      next: "Напред"
      close: "Затвори"
      login: "Към вход"
      step_1:
        eyebrow: "Стъпка 1 от 3"
        heading: "Това е публичният ви сайт"
        body: "Всеки посетител на <code>%{slug}.rugsuite.app</code> вижда страницата зад този диалог. Тук клиентите ви заявяват пране и проследяват поръчките си. Цените са примерни — ще ги настроите след вход."
      step_2:
        eyebrow: "Стъпка 2 от 3"
        heading: "Входът е най-долу на страницата"
        body: "Превъртете чак до дъното — там ще видите малък линк <strong>Служебен вход</strong> във футъра. Оттам вие и екипът влизате, за да управлявате поръчки, маршрути, куриери, SMS, отчети и потребители. Може също да отворите <code>/login</code> директно."
        show_me: "Покажи ми"
      step_3:
        eyebrow: "Стъпка 3 от 3"
        heading: "Роли, които ще ползвате"
        body: "<strong>Администратор</strong> — пълен достъп. <strong>Координатор</strong> — поръчки и маршрути. <strong>Оператор</strong> — пране. <strong>Куриер</strong> — днешните вземания и доставки. Поканете екипа от Потребители след вход."
    footer:
      brand_blurb: "Професионално машинно почистване на килими с внимание към детайла. С модерна техника и екологични препарати, премахваме упорити петна, алергени и неприятни миризми, за да се наслаждавате на чистота и комфорт."
      service_heading: "Услуга"
      contact_heading: "Контакти"
      intake_label: "Прием на заявки"
      pickup_label: "Вземане и връщане"
      copyright: "© %{year} %{name}"
      legal:
        terms: "Общи условия"
        privacy: "Поверителност"
