      heading: "Готови за чисти килими?"
      subtitle: "Подайте заявка сега и ще сме пред вратата ви скоро."
      button: "Заявка"
    welcome:
      title: "Добре дошли в %{name}!"
      back: "Назад"
      next: "Напред"
      close: "Затвори"
      login: "Към вход"
      step_1:
        eyebrow: "Стъпка 1 от 3"
        heading: "Това е публичният ви сайт"
        body: "Всеки посетител на <code>%{slug}.rugsuite.app</code> вижда страницата зад този диалог. Тук клиентите ви заявяват пране и проследяват поръчките си. Цените са примерни — ще ги настроите след вход."
      step_2:
        eyebrow: "Стъпка 2 от 3"
        heading: "Входът е най-долу на страницата"
        body: "Превъртете чак до дъното — там ще видите малък линк <strong>Служебен вход</strong> във футъра. Оттам вие и екипът влизате, за да управлявате поръчки, маршрути, куриери, SMS, отчети и потребители. Може също да отворите <code>/login</code> директно."
        show_me: "Покажи ми"
      step_3:
        eyebrow: "Стъпка 3 от 3"
        heading: "Роли, които ще ползвате"
        body: "<strong>Администратор</strong> — пълен достъп. <strong>Координатор</strong> — поръчки и маршрути. <strong>Оператор</strong> — пране. <strong>Куриер</strong> — днешните вземания и доставки. Поканете екипа от Потребители след вход."
    footer:
      brand_blurb: "Професионално машинно почистване на килими с внимание към детайла. С модерна техника и екологични препарати, премахваме упорити петна, алергени и неприятни миризми, за да се наслаждавате на чистота и комфорт."
