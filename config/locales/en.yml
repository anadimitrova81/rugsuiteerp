    hero:
      eyebrow: "Free pickup and delivery"
      title: "Clean carpets — effortless."
      subtitle: "We pick up your carpets after work hours, machine-wash them with care for every fibre, and bring them back fresh and packaged — again after hours. You stay home, we do the rest."
      cta_book: "Book a pickup"
      cta_status: "Check order"
