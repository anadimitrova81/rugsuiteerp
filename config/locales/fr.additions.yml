      hero_card_delivery_meta: 'Coursier : Marko · 7 arrêts sur la tournée'
      features_eyebrow: Ce que vous obtenez
      features_title: Tout ce dont une entreprise de lavage de tapis a besoin, rien de superflu
      features_lede: Conçu spécifiquement pour le flux de travail du lavage de tapis. Aucune contorsion de CRM générique, aucune lourdeur d'ERP.
      feature_routing_title: Optimisation des tournées d'enlèvement et de livraison
      feature_routing_body: Les clients réservent en ligne. Les coursiers voient les arrêts du jour dans l'ordre optimal, confirment l'enlèvement d'un geste, prennent une photo, c'est fait. Fini les adresses criées au téléphone.
      feature_workflow_title: Flux de lavage, suivi
      feature_workflow_body: Chaque tapis passe par en attente → enlevé → en lavage → prêt → livré. Les opérateurs voient ce qui est dans le bâtiment. Les coordinateurs voient ce qui est en retard. Les clients reçoivent un SMS dès que c'est prêt.
      feature_pricing_title: Une tarification adaptée à votre entreprise
      feature_pricing_body: Au kilogramme, à l'article, remises de volume, paiement sur facture, zones d'enlèvement gratuites — configurez une fois, appliquez partout. Multidevise dès le premier jour.
      feature_notifications_title: Notifications aux clients
      feature_notifications_body: Confirmations de réservation, devis, alertes « votre tapis est prêt » — automatisés par SMS dans la langue du client. Vous cessez de relancer, les clients cessent d'appeler.
      feature_reports_title: Des rapports que le bureau lit vraiment
      feature_reports_body: Réceptions quotidiennes, chiffre d'affaires par semaine, performance des coursiers, signaux d'attrition. Des graphiques clairs, exportables en CSV. Aucun data lake requis.
      feature_roles_title: Rôles et cloisonnement des données
      feature_roles_body: Administrateur, coordinateur, opérateur, coursier — chaque rôle ne voit que ce dont il a besoin. Les données de chaque entreprise sont strictement isolées ; rien ne fuit d'une entreprise à l'autre.
      how_title: Du formulaire web au tapis lavé en 6 étapes
      step1_title: Le client réserve en ligne
      step1_body: Un formulaire public soigné sur votre sous-domaine. Adresse validée par Google Maps, créneau d'enlèvement choisi.
      step2_title: Le coordinateur confirme l'enlèvement
      step2_body: Le coordinateur examine la demande et confirme la date d'enlèvement avec le client.
      step3_title: Le coursier collecte les tapis
      step3_body: Les arrêts du jour dans l'ordre optimal sur le téléphone du coursier. Confirmer l'enlèvement, compter les tapis, passer au suivant.
      step4_title: L'opérateur pèse et lance le lavage
      step4_body: Le poids ou le nombre d'articles est saisi, le système calcule le prix, et le tapis entre dans la file de lavage.
      step5_title: Nous envoyons le devis par SMS
      step5_body: Le client reçoit un SMS avec le poids et le coût exacts dès que le tapis est pesé.
      step6_title: Le coordinateur confirme la livraison
      step6_body: Les tapis terminés sont regroupés dans une tournée de livraison. Le coordinateur confirme le créneau, le coursier livre, le client paie.
      pricing_title: Une tarification qui évolue avec votre entreprise
      pricing_lede: Payez au fur et à mesure de votre croissance. Aucuns frais d'installation, aucun coût par coursier, aucune surprise. Contactez-nous pour un devis précis.
