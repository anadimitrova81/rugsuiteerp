      hero_eyebrow: Logiciel d'exploitation pour les entreprises de lavage de tapis
      hero_title: Digitalisez votre entreprise de lavage de tapis
      hero_subtitle: RugSuite ERP remplace les tableurs, les tickets papier et les allers-retours téléphoniques par une plateforme unique qui gère chaque étape, de la réservation à la livraison — pour une entreprise ou pour une centaine.
      start_free_trial: Commencer gratuitement
