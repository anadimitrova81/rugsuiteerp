      weighing:
        q: Où les tapis sont-ils pesés ?
        a_html: Les tapis sont pesés dans <strong>notre atelier</strong> sur une balance électronique calibrée avant que nous commencions le lavage. Vous recevez un message avec le poids et le prix final.
        a: Les tapis sont pesés dans notre atelier sur une balance électronique calibrée avant le lavage. Vous recevez un message avec le poids et le prix final.
      materials:
        q: Quels matériaux lavez-vous ?
        a: Tapis en laine, synthétiques et mixtes ; coton et microfibre pour les couvertures ; garnissages en duvet et synthétiques pour les couettes.
      stains:
        q: Que faire si j'ai des taches qui m'inquiètent ?
        a_html: Indiquez-nous à l'avance la nature de la tache et son ancienneté. Nous traitons les taches <strong>dans le cadre du lavage standard, sans frais supplémentaires</strong>. Dans la plupart des cas, le résultat dépasse les attentes. Nous ne pouvons pas garantir l'élimination des taches très anciennes ou spécifiques (par exemple l'encre ou la peinture).
        a: Indiquez-nous à l'avance la nature de la tache et son ancienneté. Nous traitons les taches dans le cadre du lavage standard, sans frais supplémentaires. Nous ne pouvons pas garantir l'élimination des taches très anciennes ou spécifiques (par exemple l'encre ou la peinture).
      safety:
        q: Est-ce sans danger pour les enfants et les animaux ?
        a_html: Oui. Nous utilisons des <strong>détergents biodégradables et hypoallergéniques</strong> sans produits chimiques agressifs. Sans danger pour les peaux sensibles, les jeunes enfants et les foyers avec animaux.
        a: Oui. Nous utilisons des détergents biodégradables et hypoallergéniques sans produits chimiques agressifs. Sans danger pour les peaux sensibles, les jeunes enfants et les foyers avec animaux.
      not_home:
        q: Que faire si je ne suis pas chez moi à l'heure de l'enlèvement ?
        a_html: Contactez-nous — nous pouvons facilement décaler l'enlèvement à un autre jour, ou vous pouvez laisser le tapis à une personne convenue (un voisin, un concierge ou un membre de la famille). Le retour est également organisé à l'avance afin que nous ne manquions pas le rendez-vous.
        a: Contactez-nous — nous pouvons facilement décaler l'enlèvement à un autre jour, ou vous pouvez laisser le tapis à une personne convenue (un voisin, un concierge ou un membre de la famille). Le retour est également organisé à l'avance.
      frequency:
        q: À quelle fréquence faut-il laver les tapis ?
        a_html: Nous recommandons un lavage professionnel <strong>tous les 12 à 18 mois</strong> pour un usage domestique, et <strong>tous les 6 à 12 mois</strong> si vous avez des animaux ou de jeunes enfants. Entre deux lavages, un battage et un aspirateur réguliers prolongent la durée de vie du tapis.
        a: Nous recommandons un lavage professionnel tous les 12 à 18 mois pour un usage domestique, et tous les 6 à 12 mois si vous avez des animaux ou de jeunes enfants.
