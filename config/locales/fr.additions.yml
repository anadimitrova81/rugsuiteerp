  privacy:
    meta_title: Politique de confidentialité · Nexus Cleaning
    eyebrow: Document
    title: Politique de confidentialité
    subtitle: Comment nous traitons et protégeons les données personnelles de nos clients.
    updated: 'Dernière mise à jour : %{date}.'
    toc_heading: Sommaire
    toc:
      controller: Responsable du traitement
      data: Quelles données nous collectons
      purposes: Finalités du traitement
