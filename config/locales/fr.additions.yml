    sections:
      controller:
        heading: 1. Responsable du traitement
        body_html: "<p>Le responsable du traitement de vos données personnelles est <strong>Nexus Cleaning</strong> (Nexus Ltd., UIC : 112641285, Plovdiv, 4 rue Deacon Ilarion), exerçant son activité à Plovdiv et dans les localités desservies.</p>\n"
      data:
        heading: 2. Quelles données nous collectons
        body_html: |
          <p>Afin d'exécuter une commande de nettoyage, nous collectons les catégories de données personnelles suivantes, que vous nous fournissez volontairement :</p>
          <ul>
            <li><strong>Coordonnées</strong> — numéro de téléphone et, éventuellement, adresse e-mail.</li>
            <li><strong>Adresse</strong> — rue, numéro et localité, nécessaires à l'enlèvement et au retour.</li>
            <li><strong>Informations sur la commande</strong> — horaire d'enlèvement souhaité, consignes d'accès, description des tapis.</li>
            <li><strong>Données techniques</strong> — adresse IP et informations sur le navigateur, collectées automatiquement lors de l'utilisation du site (voir la section « Cookies »).</li>
          </ul>
          <p>Nous ne collectons pas de données personnelles sensibles (état de santé, opinions politiques, religion, etc.).</p>
      purposes:
        heading: 3. Finalités du traitement
        body_html: |
          <p>Nous utilisons vos données aux finalités suivantes :</p>
          <ul>
            <li>Exécution de la commande précise — coordination de l'enlèvement, du nettoyage et du retour.</li>
            <li>Communication relative à la commande — confirmation, notifications de statut, réponse aux demandes.</li>
            <li>Amélioration de nos services — analyse des statistiques sur la charge de travail et les zones desservies.</li>
          </ul>
      legal_basis:
        heading: 4. Base légale
        body_html: |
          <p>Nous traitons vos données personnelles sur les bases suivantes :</p>
          <ul>
            <li><strong>Exécution d'un contrat</strong> — pour traiter votre commande.</li>
            <li><strong>Intérêt légitime</strong> — pour améliorer le service et prévenir les abus.</li>
          </ul>
      sharing:
        heading: 5. Partage avec des tiers
        body_html: |
          <p>Nous ne vendons pas vos données. Nous ne les partageons qu'avec :</p>
          <ul>
            <li>Nos coursiers (employés ou sous-traitants) — pour l'enlèvement et le retour des tapis.</li>
            <li>Les autorités publiques — uniquement lorsque la loi l'exige.</li>
          </ul>
      retention:
        heading: 6. Durées de conservation
        body_html: |
          <p>Nous ne conservons vos données que pendant la durée nécessaire à la réalisation de leurs finalités :</p>
          <ul>
            <li>Données de commande — pendant la durée de l'exécution et une période supplémentaire pour les réclamations.</li>
            <li>Journaux techniques — généralement jusqu'à 12 mois.</li>
          </ul>
      security:
        heading: 7. Sécurité des données
        body_html: "<p>Nous appliquons des mesures organisationnelles et techniques pour protéger vos données : accès réservé aux seuls employés qui ont besoin de l'information, transmission chiffrée des données via le site (HTTPS) et sauvegardes régulières. Néanmoins, aucun système n'est totalement invulnérable, et nous vous prions de nous signaler immédiatement tout soupçon d'utilisation abusive.</p>\n"
      rights:
        heading: 8. Vos droits
        body_html: |
          <p>En vertu du RGPD, vous avez le droit de :</p>
          <ul>
            <li><strong>Accès</strong> — obtenir des informations sur les données vous concernant que nous traitons.</li>
            <li><strong>Rectification</strong> — demander la correction de données inexactes ou incomplètes.</li>
            <li><strong>Effacement</strong> — demander la suppression des données, sauf lorsque nous avons une obligation légale de les conserver.</li>
            <li><strong>Limitation</strong> — demander la limitation du traitement.</li>
            <li><strong>Portabilité</strong> — recevoir vos données dans un format structuré et lisible par machine.</li>
            <li><strong>Opposition</strong> — vous opposer à un traitement fondé sur l'intérêt légitime.</li>
            <li><strong>Réclamation</strong> — déposer une réclamation auprès de la Commission de protection des données personnelles (CPDP).</li>
          </ul>
      cookies:
        heading: 9. Cookies
        body_html: "<p>Le site n'utilise que les cookies nécessaires à son fonctionnement de base (par exemple, pour maintenir une session lors de la connexion au panneau d'administration). Nous n'utilisons pas de cookies publicitaires ou de suivi de tiers.</p>\n"
      contact:
        heading: 10. Contact pour les données personnelles
        body_html: |
          <p>Si vous avez des questions sur le traitement de vos données ou souhaitez exercer l'un de vos droits, contactez-nous :</p>
          <ul>
            <li>Téléphone : <a href="tel:+359899771972">+359 899 771 972</a></li>
            <li>E-mail : <a href="mailto:office@nexus-cleaning.com">office@nexus-cleaning.com</a></li>
          </ul>
          <p>Nous répondrons à votre demande dans un délai d'un mois à compter de sa réception.</p>
      changes:
        heading: 11. Modifications de la politique
        body_html: "<p>Nous pouvons mettre à jour cette politique lorsque nos pratiques ou les exigences légales évoluent. La version en vigueur est toujours publiée à cette adresse avec la date de dernière mise à jour. En cas de modifications importantes, nous vous en informerons de manière appropriée (par exemple, par un avis sur le site ou par e-mail).</p>\n"
  terms:
    meta_title: Conditions générales · Nexus Cleaning
    eyebrow: Document
    title: Conditions générales
    subtitle: Conditions d'utilisation des services de Nexus Cleaning.
    updated: 'Dernière mise à jour : %{date}.'
    toc_heading: Sommaire
    toc:
      scope: Champ d'application et parties
      services: Services
      orders: Commandes et confirmation
      pricing: Prix et paiements
      pickup: Enlèvement et retour
      timing: Délais de traitement
      liability: Responsabilité et dommages
      cancellation: Annulation de commande
      complaints: Réclamations
      privacy: Données personnelles
      changes: Modifications des conditions
      disputes: Droit applicable et litiges
    sections:
      scope:
        heading: 1. Champ d'application et parties
        body_html: '<p>Les présentes conditions générales régissent la relation entre <strong>Nexus Cleaning</strong> (Nexus Ltd., UIC : 112641285, Plovdiv, 4 rue Deacon Ilarion, ci-après le « Prestataire ») et les personnes physiques ou morales qui commandent des services (dénommées le « Client ») via le site web <strong>nexus-cleaning.com</strong>, par téléphone ou par message.</p>

          '
      services:
        heading: 2. Services
        body_html: "<p>Le Prestataire propose le nettoyage en machine des tapis, chemins de couloir, couvertures, édredons traditionnels et couettes, y compris l'enlèvement et le retour gratuits à Plovdiv et dans les localités desservies. Le processus comprend le battage, le lavage, l'essorage, le brossage, la désodorisation et l'emballage.</p>\n"
      orders:
        heading: 3. Commandes et confirmation
        body_html: |
          <p>Une commande peut être passée en ligne via le formulaire de demande du site, par téléphone ou par message en utilisant les coordonnées fournies. Après réception de la demande, le Prestataire contacte le Client pour confirmer l'heure d'enlèvement.</p>
          <p>Le contrat est réputé conclu une fois l'heure et l'adresse d'enlèvement précises confirmées.</p>
      pricing:
        heading: 4. Prix et paiements
        body_html: |
          <p>Les prix en vigueur sont publiés sur la page d'accueil du site. Les prix des tapis, chemins de couloir et couvertures sont déterminés au poids, mesuré à l'aide d'une balance électronique calibrée dans les locaux du Prestataire. Les prix des couettes sont à l'article.</p>
          <p>Le paiement s'effectue à la livraison — en espèces ou par carte bancaire. Après paiement, le Client reçoit un reçu avec un numéro de référence unique.</p>
      pickup:
        heading: 5. Enlèvement et retour
        body_html: |
          <p>Les coursiers du Prestataire effectuent l'enlèvement et le retour dans le créneau compris entre 18:00 et 20:30, sur rendez-vous préalable. Le transport est gratuit dans les localités desservies.</p>
          <p>Le Client assure la remise des tapis à l'heure convenue, en personne ou par l'intermédiaire d'une personne désignée.</p>
      timing:
        heading: 6. Délais de traitement
        body_html: "<p>Le délai de traitement standard est de 3 à 5 jours ouvrables à compter de la date d'enlèvement. Pendant les périodes de forte activité, pour des tissus spécifiques ou en cas de circonstances imprévues, le délai peut être prolongé jusqu'à 7 jours ouvrables. Le Prestataire informe le Client de la date de retour effective.</p>\n"
      liability:
        heading: 7. Responsabilité et dommages
        body_html: |
          <p>Le Prestataire fait preuve d'un soin professionnel dans le traitement de chaque article. Si des défauts cachés, une usure ou des caractéristiques particulières susceptibles d'entraîner des dommages lors d'un nettoyage standard sont identifiés, le Prestataire en informe le Client au préalable et convient de la marche à suivre.</p>
          <p>Le montant maximal de l'indemnisation pour un article endommagé ou manquant est de 50,00 € (97,79 BGN), selon l'état de l'article et la nature du dommage.</p>
      cancellation:
        heading: 8. Annulation de commande
        body_html: "<p>Le Client peut annuler une commande sans frais avant l'enlèvement des tapis.</p>\n"
      complaints:
        heading: 9. Réclamations
        body_html: |
          <p>Le Client a le droit de déposer une réclamation concernant la qualité du service dans un délai de <em>14</em> jours à compter du retour des tapis. La réclamation est soumise par téléphone ou par e-mail, accompagnée d'une description du problème.</p>
          <p>Le Prestataire examine la réclamation dans un délai de 30 jours et propose une solution — nouveau nettoyage, correction ou remboursement partiel.</p>
      privacy:
        heading: 10. Données personnelles
        body_before: Le traitement des données personnelles du Client est effectué conformément à
        link_text: la Politique de confidentialité
        body_after: ", qui fait partie intégrante des présentes conditions générales."
      changes:
        heading: 11. Modifications des conditions
        body_html: "<p>Le Prestataire se réserve le droit de modifier les présentes conditions générales. La version en vigueur est toujours publiée à cette adresse avec la date de dernière mise à jour. Les modifications prennent effet à la date de publication et n'affectent pas les commandes déjà confirmées.</p>\n"
      disputes:
        heading: 12. Droit applicable et litiges
        body_html: |
          <p>Le droit bulgare s'applique aux présentes conditions générales. Les litiges sont résolus à l'amiable et, lorsque cela n'est pas possible, devant le tribunal bulgare compétent.</p>
          <p>Pour toute question relative aux présentes conditions, vous pouvez nous joindre par téléphone au <a href="tel:+359899771972">+359 899 771 972</a> ou par e-mail à <a href="mailto:office@nexus-cleaning.com">office@nexus-cleaning.com</a>.</p>
