        q: Y a-t-il des frais supplémentaires ou des quantités minimales ?
        a_html: Non. Le transport est <strong>gratuit</strong> à Plovdiv et dans la région. Il n'y a aucuns frais cachés ni quantité minimale — nous prenons tout, d'un simple chemin de couloir aux tapis et couettes.
        a: Non. Le transport est gratuit à Plovdiv et dans la région. Il n'y a aucuns frais cachés ni quantité minimale — nous prenons tout, d'un simple chemin de couloir aux tapis et couettes.
      how_to_order:
        q: Comment passer une commande ?
        intro: 'Vous avez trois options — choisissez celle qui vous convient le mieux :'
        form_link: le formulaire de commande
        online_html: "<strong>En ligne</strong> — remplissez %{link}. Cela prend moins d'une minute."
        by_phone_html: <strong>Par téléphone</strong> — appelez-nous au <a href="tel:+359899771972">+359 899 771 972</a> entre 09:00 et 20:00.
        by_sms_html: "<strong>SMS ou Viber</strong> — écrivez-nous au même numéro et nous vous recontacterons pour régler les détails."
        a: 'Vous avez trois options : en ligne via le formulaire de commande, par téléphone au +359 899 771 972 entre 09:00 et 20:00, ou par SMS/Viber au même numéro.'
      turnaround:
        q: Combien de jours cela prend-il ?
        a_html: Les commandes sont normalement traitées sous <strong>3 à 5 jours ouvrables</strong>. Pendant les périodes de forte activité ou pour des tissus spécifiques, cela peut prendre jusqu'à 7 jours. Nous vous contactons dès que les tapis sont prêts à être retournés.
