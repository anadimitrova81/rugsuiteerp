      hero_card_wash_meta: 'Drum 3 · Програма: Вълна · Очаквано 16:40'
      hero_card_delivery_meta: 'Куриер: Marko · 7 спирки по маршрута'
      features_eyebrow: Какво получавате
      features_title: Всичко, от което една фабрика за пране има нужда, и нищо излишно.
      features_lede: Създадена специално за работния процес при пране на килими. Без нагаждане на генерични CRM системи и без излишъците на тежки ERP платформи.
      feature_routing_title: Маршрути за вземане и доставка
      feature_routing_body: Клиентите заявяват онлайн. Куриерите виждат днешните спирки в оптимален ред, потвърждават вземането с едно докосване, правят снимка и готово. Край на диктуването на адреси по телефона.
      feature_workflow_title: Проследен работен процес на пране
      feature_workflow_body: Всеки килим минава през чакащ → взет → в пране → готов → доставен. Операторите виждат какво има в сградата. Координаторите виждат какво е просрочено. Клиентите получават SMS, щом килимът е готов.
      feature_pricing_title: Ценообразуване, което пасва на вашия бизнес
      feature_pricing_body: На килограм, на брой, отстъпки за количество, ваучери, зони с безплатно вземане — настройте веднъж, прилагайте навсякъде. Много валути от първия ден.
      feature_notifications_title: Известия за клиентите
      feature_notifications_body: Потвърждения на заявки, ценови оферти, известия „килимът ви е готов“ — автоматично чрез SMS на езика на клиента. Вие спирате да гоните, клиентите спират да звънят.
      feature_reports_title: Справки, които офисът наистина чете
      feature_reports_body: Дневен прием, приходи по седмици, представяне на куриерите, сигнали за отлив на клиенти. Ясни графики, експорт към CSV. Без нужда от data lake.
      feature_roles_title: Роли и изолация на наемателите
      feature_roles_body: Администратор, координатор, оператор, куриер — всяка роля вижда само каквото ѝ трябва. Данните на всяка фабрика са строго изолирани; нищо не изтича между наемателите.
      how_title: От онлайн формата до изпран килим в 5 стъпки.
      step1_title: Клиентът заявява онлайн
      step1_body: Изчистена публична форма на вашия поддомейн. Адресът се валидира чрез Google Maps, избира се часови интервал за вземане и се изпраща SMS потвърждение.
      step2_title: Куриерът взема
