      hero_title: Управлявайте фабриката си за пране на килими като технологична компания.
      hero_subtitle: RugSuite ERP заменя таблиците, хартиените бележки и безкрайните обаждания с една платформа, която покрива всяка стъпка — от заявката до доставката, за една фабрика или за сто.
      start_free_trial: Изпробвайте безплатно
      hero_see_how: Вижте как работи
      hero_bullet_1: Мулти-наемна архитектура — по една платформа за всяка компания, по една компания на поддомейн
      hero_bullet_2: Ценообразуване, валути, езици и зони на обслужване за всяка фабрика поотделно
      hero_bullet_3: Изградена на Rails 8 + Postgres — хоствайте я сами или я оставете на нас
