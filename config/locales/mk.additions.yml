    sections:
      controller:
        heading: 1. Контролор на податоци
        body_html: "<p>Контролор на вашите лични податоци е <strong>Nexus Cleaning</strong> (Nexus Ltd., ЕИК: 112641285, Пловдив, ул. Дијакон Иларион 4), кој работи во Пловдив и опслужуваните населени места.</p>\n"
      data:
        heading: 2. Кои податоци ги собираме
        body_html: |
          <p>За да исполниме нарачка за чистење, ги собираме следните категории лични податоци, доброволно дадени од вас:</p>
          <ul>
            <li><strong>Контакт-податоци</strong> — телефонски број, и по избор е-пошта.</li>
            <li><strong>Адреса</strong> — улица, број и населено место, потребни за преземање и враќање.</li>
            <li><strong>Информации за нарачката</strong> — саканото време на преземање, забелешки за пристап, опис на теписите.</li>
            <li><strong>Технички податоци</strong> — IP адреса и информации за прелистувачот, собрани автоматски при користење на страницата (видете го делот „Колачиња“).</li>
          </ul>
          <p>Не собираме чувствителни лични податоци (здравствена состојба, политички ставови, религија и слично).</p>
      purposes:
        heading: 3. Цели на обработката
        body_html: |
          <p>Ги користиме вашите податоци за следните цели:</p>
          <ul>
            <li>Исполнување на конкретната нарачка — координирање на преземањето, чистењето и враќањето.</li>
            <li>Комуникација во врска со нарачката — потврда, известувања за статус, одговор на прашања.</li>
            <li>Подобрување на нашите услуги — анализа на статистика за обемот на работа и опслужуваните области.</li>
          </ul>
      legal_basis:
        heading: 4. Правна основа
        body_html: |
          <p>Вашите лични податоци ги обработуваме врз следните основи:</p>
          <ul>
            <li><strong>Исполнување на договор</strong> — за да ја обработиме вашата нарачка.</li>
            <li><strong>Легитимен интерес</strong> — за да ја подобриме услугата и да спречиме злоупотреба.</li>
          </ul>
      sharing:
        heading: 5. Споделување со трети страни
        body_html: |
          <p>Не ги продаваме вашите податоци. Може да ги споделиме само со:</p>
          <ul>
            <li>Нашите курири (вработени или подизведувачи) — за преземање и враќање на теписите.</li>
            <li>Државни органи — само каде што тоа е предвидено со закон.</li>
          </ul>
      retention:
        heading: 6. Периоди на чување
        body_html: |
          <p>Вашите податоци ги чуваме само за периодот потребен за постигнување на нивните цели:</p>
          <ul>
            <li>Податоци за нарачката — за времетраењето на исполнувањето и дополнителен период за рекламации.</li>
            <li>Технички дневници — обично до 12 месеци.</li>
          </ul>
      security:
        heading: 7. Безбедност на податоците
        body_html: "<p>Применуваме организациски и технички мерки за заштита на вашите податоци: пристап само за вработените на кои им се потребни информациите, шифрирано пренесување на податоци преку страницата (HTTPS) и редовни резервни копии. Сепак, ниту еден систем не е целосно неранлив, и ве молиме веднаш да пријавите ако се сомневате на каква било злоупотреба.</p>\n"
      rights:
        heading: 8. Вашите права
        body_html: |
          <p>Согласно GDPR имате право на:</p>
          <ul>
            <li><strong>Пристап</strong> — да добиете информации за тоа кои ваши податоци ги обработуваме.</li>
            <li><strong>Исправка</strong> — да побарате корекција на неточни или нецелосни податоци.</li>
            <li><strong>Бришење</strong> — да побарате бришење на податоците, освен кога имаме законска обврска да ги чуваме.</li>
            <li><strong>Ограничување</strong> — да побарате ограничување на обработката.</li>
            <li><strong>Преносливост</strong> — да ги добиете вашите податоци во структуриран, машински читлив формат.</li>
            <li><strong>Приговор</strong> — да приговорите на обработка заснована на легитимен интерес.</li>
            <li><strong>Жалба</strong> — да поднесете жалба до Комисијата за заштита на личните податоци.</li>
          </ul>
      cookies:
        heading: 9. Колачиња
        body_html: "<p>Страницата користи само колачиња потребни за нејзиното основно функционирање (на пример, за одржување на сесија при најава во администраторскиот панел). Не користиме рекламни или следечки колачиња од трети страни.</p>\n"
      contact:
        heading: 10. Контакт за лични податоци
        body_html: |
          <p>Ако имате прашања за обработката на вашите податоци или сакате да остварите некое од вашите права, контактирајте нè:</p>
          <ul>
            <li>Телефон: <a href="tel:+359899771972">+359 899 771 972</a></li>
            <li>Е-пошта: <a href="mailto:office@nexus-cleaning.com">office@nexus-cleaning.com</a></li>
          </ul>
          <p>Ќе одговориме на вашето прашање во рок од еден месец од неговото примање.</p>
      changes:
        heading: 11. Промени на политиката
        body_html: "<p>Може да ја ажурираме оваа политика кога ќе се сменат нашите практики или законските барања. Тековната верзија секогаш е објавена на оваа адреса со датумот на последно ажурирање. Во случај на суштински промени, ќе ве известиме на соодветен начин (на пример, со известување на страницата или преку е-пошта).</p>\n"
  terms:
    meta_title: Услови на користење · Nexus Cleaning
    eyebrow: Документ
