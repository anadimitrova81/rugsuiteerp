      changes: Промени на условите
      disputes: Меродавно право и спорови
    sections:
      scope:
        heading: 1. Опфат и страни
        body_html: '<p>Овие услови на користење ги уредуваат односите меѓу <strong>Nexus Cleaning</strong> (Nexus Ltd., ЕИК: 112641285, Пловдив, ул. Дијакон Иларион 4, во натамошниот текст „Давателот“) и физичките или правните лица што нарачуваат услуги (наречени „Клиент“) преку веб-страницата <strong>nexus-cleaning.com</strong>, по телефон или со порака.</p>

          '
      services:
        heading: 2. Услуги
        body_html: "<p>Давателот нуди машинско чистење на теписи, патеки, ќебиња, традиционални јоргани и покривки, вклучувајќи бесплатно преземање и враќање во Пловдив и опслужуваните населени места. Процесот вклучува тепање, перење, центрифугирање, четкање, дезодорирање и пакување.</p>\n"
      orders:
        heading: 3. Нарачки и потврда
        body_html: |
          <p>Нарачка може да се направи преку интернет со формуларот за барање на страницата, по телефон или со порака преку дадените контакти. По приемот на барањето, Давателот го контактира Клиентот за да го потврди времето на преземање.</p>
          <p>Договорот се смета за склучен штом ќе се потврдат конкретното време и адреса на преземање.</p>
      pricing:
        heading: 4. Цени и плаќања
        body_html: |
          <p>Тековните цени се објавени на почетната страница. Цените за теписи, патеки и ќебиња се определуваат по тежина, измерена со калибрирана електронска вага во просториите на Давателот. Цените за јоргани се по ставка.</p>
          <p>Плаќањето се врши при достава — во готово или со банкарска картичка. По плаќањето, Клиентот добива потврда со единствен референтен број.</p>
      pickup:
        heading: 5. Преземање и враќање
        body_html: |
          <p>Куририте на Давателот вршат преземање и враќање во терминот меѓу 18:00 и 20:30, по претходен договор. Превозот е бесплатен во опслужуваните населени места.</p>
          <p>Клиентот обезбедува предавање на теписите во договореното време лично или преку определено лице.</p>
      timing:
        heading: 6. Рокови на изработка
        body_html: "<p>Стандардниот рок на изработка е 3 – 5 работни дена од датумот на преземање. Во периоди со поголема зафатеност, за специфични ткаенини или во непредвидени околности, рокот може да се продолжи до 7 работни дена. Давателот го известува Клиентот за вистинскиот датум на враќање.</p>\n"
      liability:
        heading: 7. Одговорност и штети
        body_html: |
          <p>Давателот применува професионална грижа при обработката на секој предмет. Ако се утврдат скриени дефекти, истрошеност или специфични својства што би можеле да доведат до штета при стандардно чистење, Давателот однапред го известува Клиентот и се договара за понатамошните дејствија.</p>
          <p>Максималниот износ на надомест за оштетен или изгубен предмет е до €50,00 (BGN 97.79), во зависност од состојбата на предметот и природата на штетата.</p>
      cancellation:
        heading: 8. Откажување на нарачка
        body_html: "<p>Клиентот може да откаже нарачка пред теписите да бидат преземени, бесплатно.</p>\n"
      complaints:
        heading: 9. Рекламации
        body_html: |
          <p>Клиентот има право да поднесе рекламација за квалитетот на услугата во рок од <em>14</em> дена од враќањето на теписите. Рекламацијата се поднесува по телефон или е-пошта, придружена со опис на проблемот.</p>
          <p>Давателот ја разгледува рекламацијата во рок од 30 дена и предлага решение — повторно чистење, корекција или делумно враќање на средствата.</p>
      privacy:
        heading: 10. Лични податоци
        body_before: Обработката на личните податоци на Клиентот се врши во согласност со
        link_text: Политиката за приватност
        body_after: ", која е составен дел на овие услови на користење."
      changes:
        heading: 11. Промени на условите
        body_html: "<p>Давателот го задржува правото да ги измени овие услови на користење. Тековната верзија секогаш е објавена на оваа адреса со датумот на последно ажурирање. Промените стапуваат на сила од датумот на објавување и не влијаат на веќе потврдените нарачки.</p>\n"
      disputes:
        heading: 12. Меродавно право и спорови
        body_html: |
          <p>За овие услови на користење се применува бугарското право. Споровите се решаваат со заемен договор, а каде што тоа не е можно — пред надлежниот бугарски суд.</p>
          <p>За контакт по прашања поврзани со овие услови, може да нè достигнете по телефон на <a href="tel:+359899771972">+359 899 771 972</a> или преку е-пошта на <a href="mailto:office@nexus-cleaning.com">office@nexus-cleaning.com</a>.</p>
  marketing:
