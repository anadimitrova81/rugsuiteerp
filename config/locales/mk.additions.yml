        a_html: Кажете ни однапред што е дамката и колку е стара. Дамките ги третираме како <strong>дел од стандардното перење, без дополнителна наплата</strong>. Во повеќето случаи резултатот ги надминува очекувањата. Не можеме да гарантираме отстранување на многу стари или специфични дамки (на пример мастило или боја).
        a: Кажете ни однапред што е дамката и колку е стара. Дамките ги третираме како дел од стандардното перење, без дополнителна наплата. Не можеме да гарантираме отстранување на многу стари или специфични дамки (на пример мастило или боја).
      safety:
        q: Дали е безбедно за деца и миленици?
        a_html: Да. Користиме <strong>биоразградливи, хипоалергени детергенти</strong> без агресивни хемикалии. Безбедно за чувствителна кожа, мали деца и домови со миленици.
        a: Да. Користиме биоразградливи, хипоалергени детергенти без агресивни хемикалии. Безбедно за чувствителна кожа, мали деца и домови со миленици.
      not_home:
        q: Што ако не сум дома во времето на преземање?
        a_html: Јавете ни се — лесно можеме да го преместиме преземањето на друг ден, или може да го оставите тепихот кај договорено лице (сосед, портир или член на семејството). Враќањето исто така се договара однапред за да не го пропуштиме терминот.
        a: Јавете ни се — лесно можеме да го преместиме преземањето на друг ден, или може да го оставите тепихот кај договорено лице (сосед, портир или член на семејството). Враќањето исто така се договара однапред.
      frequency:
        q: Колку често треба да се перат теписите?
        a_html: Препорачуваме професионално перење <strong>еднаш на секои 12 – 18 месеци</strong> за домашна употреба, и <strong>на секои 6 – 12 месеци</strong> ако имате миленици или мали деца. Меѓу перењата, редовното тепање и правосмукање го продолжуваат векот на тепихот.
        a: Препорачуваме професионално перење еднаш на секои 12 – 18 месеци за домашна употреба, и на секои 6 – 12 месеци ако имате миленици или мали деца.
