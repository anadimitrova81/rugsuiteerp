        a_html: The carpets are weighed at <strong>our workshop</strong> on a calibrated electronic scale before we start washing. You receive a message with the weight and the final price.
        a: The carpets are weighed at our workshop on a calibrated electronic scale before washing. You receive a message with the weight and the final price.
      materials:
        q: What materials do you wash?
        a: Wool, synthetic and blended carpets; cotton and microfibre for blankets; down and synthetic fills for quilts.
      stains:
        q: What if I have stains I'm worried about?
        a_html: Tell us in advance what the stain is and how old it is. We treat stains as <strong>part of the standard wash, at no extra charge</strong>. In most cases the result exceeds expectations. We can't guarantee the removal of very old or specific stains (for example ink or paint).
        a: Tell us in advance what the stain is and how old it is. We treat stains as part of the standard wash, at no extra charge. We can't guarantee the removal of very old or specific stains (for example ink or paint).
      safety:
        q: Is it safe for children and pets?
        a_html: Yes. We use <strong>biodegradable, hypoallergenic detergents</strong> with no aggressive chemicals. Safe for sensitive skin, young children and homes with pets.
        a: Yes. We use biodegradable, hypoallergenic detergents with no aggressive chemicals. Safe for sensitive skin, young children and homes with pets.
      not_home:
        q: What if I'm not home at the pickup time?
        a_html: Get in touch — we can easily move the pickup to another day, or you can leave the carpet with an agreed person (a neighbour, doorman or family member). The return is also arranged in advance so we don't miss the appointment.
        a: Get in touch — we can easily move the pickup to another day, or you can leave the carpet with an agreed person (a neighbour, doorman or family member). The return is also arranged in advance.
      frequency:
        q: How often should carpets be washed?
        a_html: We recommend professional washing <strong>once every 12 – 18 months</strong> for home use, and <strong>every 6 – 12 months</strong> if you have pets or young children. Between washes, regular beating and vacuuming extend the life of the carpet.
        a: We recommend professional washing once every 12 – 18 months for home use, and every 6 – 12 months if you have pets or young children.
