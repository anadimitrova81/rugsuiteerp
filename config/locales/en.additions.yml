      features_eyebrow: What you get
      features_title: Everything a wash factory needs, nothing it doesn't.
      features_lede: Purpose-built for the carpet wash workflow. No generic CRM contortions, no ERP bloat.
      feature_routing_title: Pickup & delivery routing
      feature_routing_body: Customers book online. Couriers see today's stops in optimal order, swipe to confirm pickup, snap a photo, done. No more shouting addresses into the phone.
      feature_workflow_title: Wash workflow, tracked
      feature_workflow_body: Every rug moves through pending → picked up → in wash → ready → delivered. Operators see what's in the building. Coordinators see what's overdue. Customers get an SMS when it's ready.
      feature_pricing_title: Pricing that fits your business
      feature_pricing_body: Per-kilogram, per-item, bulk discounts, vouchers, free pickup zones — configure once, apply everywhere. Multi-currency from day one.
      feature_notifications_title: Customer notifications
      feature_notifications_body: Booking confirmations, price quotes, "your rug is ready" alerts — automated by SMS in the customer's own language. You stop chasing, customers stop calling.
      feature_reports_title: Reports the office actually reads
      feature_reports_body: Daily intake, revenue by week, courier performance, churn signals. Plain charts, exportable to CSV. No data lake required.
      feature_roles_title: Roles & tenant isolation
      feature_roles_body: Admin, coordinator, operator, courier — each role sees only what they need. Every factory's data is hard-isolated; nothing leaks between tenants.
      how_title: From web form to washed rug in 5 steps.
      step1_title: Customer books online
      step1_body: A clean public form on your subdomain. Address validated against Google Maps, pickup window picked, SMS confirmation sent.
      step2_title: Courier picks up
      step2_body: Today's stops in optimal order on the courier's phone. Confirm pickup, count the rugs, move on.
      step3_title: Operator weighs & washes
      step3_body: Weight or item count goes in, the system calculates the price, the customer gets a quote SMS, the rug enters the wash queue.
      step4_title: Coordinator schedules delivery
      step4_body: Done rugs are bundled into a delivery route. Customer chooses or confirms the slot. Courier delivers, customer pays.
      step5_title: You see the numbers
      step5_body: Daily intake, weekly revenue, courier load, repeat-customer share — visible on a single dashboard, exportable on demand.
      pricing_title: Pricing that scales with your factory.
