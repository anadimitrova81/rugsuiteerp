  privacy:
    meta_title: Privacy Policy · Nexus Cleaning
    eyebrow: Document
    title: Privacy Policy
    subtitle: How we process and protect the personal data of our clients.
    updated: 'Last updated: %{date}.'
    toc_heading: Contents
    toc:
      controller: Data controller
      data: What data we collect
      purposes: Purposes of processing
      legal_basis: Legal basis
      sharing: Sharing with third parties
      retention: Retention periods
      security: Data security
      rights: Your rights
      cookies: Cookies
      contact: Contact for personal data
      changes: Changes to the policy
    sections:
      controller:
        heading: 1. Data controller
        body_html: "<p>The controller of your personal data is <strong>Nexus Cleaning</strong> (Nexus Ltd., UIC: 112641285, Plovdiv, 4 Deacon Ilarion St.), operating within Plovdiv and the served localities.</p>\n"
      data:
        heading: 2. What data we collect
        body_html: |
          <p>In order to fulfil a cleaning order, we collect the following categories of personal data, voluntarily provided by you:</p>
          <ul>
            <li><strong>Contact details</strong> — telephone number, and optionally email.</li>
            <li><strong>Address</strong> — street, number and locality, required for pickup and return.</li>
            <li><strong>Order information</strong> — desired pickup time, access notes, description of the rugs.</li>
            <li><strong>Technical data</strong> — IP address and browser information, collected automatically when using the site (see the "Cookies" section).</li>
          </ul>
          <p>We do not collect sensitive personal data (health status, political views, religion, etc.).</p>
      purposes:
        heading: 3. Purposes of processing
        body_html: |
          <p>We use your data for the following purposes:</p>
          <ul>
            <li>Fulfilling the specific order — coordinating pickup, cleaning and return.</li>
            <li>Communication regarding the order — confirmation, status notifications, responding to enquiries.</li>
            <li>Improving our services — analysing statistics on workload and served areas.</li>
          </ul>
      legal_basis:
        heading: 4. Legal basis
        body_html: |
          <p>We process your personal data on the following grounds:</p>
          <ul>
            <li><strong>Performance of a contract</strong> — to process your order.</li>
            <li><strong>Legitimate interest</strong> — to improve the service and prevent abuse.</li>
          </ul>
      sharing:
        heading: 5. Sharing with third parties
        body_html: |
          <p>We do not sell your data. We may share it only with:</p>
          <ul>
            <li>Our couriers (employees or subcontractors) — for pickup and return of the rugs.</li>
            <li>Government authorities — only where required by law.</li>
          </ul>
      retention:
        heading: 6. Retention periods
        body_html: |
          <p>We store your data only for the period necessary to achieve its purposes:</p>
          <ul>
            <li>Order data — for the duration of fulfilment and an additional period for complaints.</li>
            <li>Technical logs — usually up to 12 months.</li>
          </ul>
      security:
        heading: 7. Data security
        body_html: "<p>We apply organisational and technical measures to protect your data: access only for employees who need the information, encrypted transmission of data through the site (HTTPS) and regular backups. Nevertheless, no system is completely invulnerable, and we ask you to report immediately if you suspect any misuse.</p>\n"
      rights:
        heading: 8. Your rights
        body_html: |
          <p>Under the GDPR you have the right to:</p>
          <ul>
            <li><strong>Access</strong> — to obtain information about what data of yours we process.</li>
            <li><strong>Rectification</strong> — to request correction of inaccurate or incomplete data.</li>
            <li><strong>Erasure</strong> — to request deletion of the data, except where we have a legal obligation to keep it.</li>
            <li><strong>Restriction</strong> — to request restriction of the processing.</li>
            <li><strong>Portability</strong> — to receive your data in a structured, machine-readable format.</li>
            <li><strong>Objection</strong> — to object to processing based on legitimate interest.</li>
            <li><strong>Complaint</strong> — to lodge a complaint with the Commission for Personal Data Protection (CPDP).</li>
          </ul>
      cookies:
        heading: 9. Cookies
        body_html: "<p>The site uses only cookies necessary for its basic functioning (for example, to maintain a session when logging into the admin panel). We do not use advertising or tracking cookies from third parties.</p>\n"
      contact:
        heading: 10. Contact for personal data
        body_html: |
          <p>If you have questions about the processing of your data or wish to exercise any of your rights, contact us:</p>
          <ul>
            <li>Phone: <a href="tel:+359899771972">+359 899 771 972</a></li>
            <li>Email: <a href="mailto:office@nexus-cleaning.com">office@nexus-cleaning.com</a></li>
          </ul>
          <p>We will respond to your enquiry within one month of receiving it.</p>
      changes:
        heading: 11. Changes to the policy
        body_html: "<p>We may update this policy when our practices or legal requirements change. The current version is always published at this address with the date of last update. In the event of material changes, we will notify you in an appropriate manner (for example, by a notice on the site or by email).</p>\n"
  terms:
    meta_title: Terms of Service · Nexus Cleaning
    eyebrow: Document
    title: Terms of Service
    subtitle: Terms for using the services of Nexus Cleaning.
    updated: 'Last updated: %{date}.'
    toc_heading: Contents
    toc:
      scope: Scope and parties
      services: Services
      orders: Orders and confirmation
      pricing: Prices and payments
      pickup: Pickup and return
      timing: Turnaround times
      liability: Liability and damages
      cancellation: Order cancellation
      complaints: Complaints
      privacy: Personal data
      changes: Changes to the terms
      disputes: Governing law and disputes
    sections:
      scope:
        heading: 1. Scope and parties
        body_html: '<p>These terms of service govern the relationship between <strong>Nexus Cleaning</strong> (Nexus Ltd., UIC: 112641285, Plovdiv, 4 Deacon Ilarion St., hereinafter the "Provider") and natural or legal persons who order services (referred to as the "Client") through the website <strong>nexus-cleaning.com</strong>, by telephone or by message.</p>

          '
      services:
        heading: 2. Services
        body_html: "<p>The Provider offers machine cleaning of rugs, runners, blankets, traditional quilts and duvets, including free pickup and return in Plovdiv and the served localities. The process includes beating, washing, spin-drying, brushing, deodorising and packaging.</p>\n"
      orders:
        heading: 3. Orders and confirmation
        body_html: |
          <p>An order may be placed online through the request form on the site, by telephone or by message using the contacts provided. After receiving the request, the Provider contacts the Client to confirm the pickup time.</p>
          <p>The contract is deemed concluded once the specific pickup time and address are confirmed.</p>
      pricing:
        heading: 4. Prices and payments
        body_html: |
          <p>Current prices are published on the home page of the site. Prices for rugs, runners and blankets are determined by weight, measured with a calibrated electronic scale at the Provider's facility. Prices for duvets are per item.</p>
          <p>Payment is made on delivery — in cash or by bank card. After payment, the Client receives a receipt with a unique reference number.</p>
      pickup:
        heading: 5. Pickup and return
        body_html: |
          <p>The Provider's couriers carry out pickup and return within the time slot between 18:00 and 20:30, by prior arrangement. Transport is free within the served localities.</p>
          <p>The Client ensures the handover of the rugs at the agreed time in person or through a designated person.</p>
      timing:
        heading: 6. Turnaround times
        body_html: "<p>The standard turnaround time is 3 – 5 working days from the date of pickup. During busier periods, for specific fabrics or in unforeseen circumstances, the term may be extended to 7 working days. The Provider informs the Client of the actual return date.</p>\n"
      liability:
        heading: 7. Liability and damages
        body_html: |
          <p>The Provider exercises professional care in processing each item. If hidden defects, wear or specific characteristics that could lead to damage during standard cleaning are identified, the Provider notifies the Client in advance and agrees on the course of action.</p>
          <p>The maximum amount of compensation for a damaged or missing item is up to €50.00 (BGN 97.79), depending on the condition of the item and the nature of the damage.</p>
      cancellation:
        heading: 8. Order cancellation
        body_html: "<p>The Client may cancel an order before the rugs are picked up, free of charge.</p>\n"
      complaints:
        heading: 9. Complaints
        body_html: |
          <p>The Client has the right to file a complaint about the quality of the service within <em>14</em> days of the return of the rugs. The complaint is submitted by telephone or email, accompanied by a description of the problem.</p>
          <p>The Provider reviews the complaint within 30 days and proposes a solution — re-cleaning, correction or partial refund.</p>
      privacy:
        heading: 10. Personal data
        body_before: The processing of the Client's personal data is carried out in accordance with
        link_text: the Privacy Policy
        body_after: ", which forms an integral part of these terms of service."
      changes:
        heading: 11. Changes to the terms
        body_html: "<p>The Provider reserves the right to amend these terms of service. The current version is always published at this address with the date of last update. Changes take effect from the date of publication and do not affect already confirmed orders.</p>\n"
      disputes:
        heading: 12. Governing law and disputes
        body_html: |
          <p>Bulgarian law applies to these terms of service. Disputes are resolved by mutual agreement, and where this is not possible — before the competent Bulgarian court.</p>
          <p>For contact on matters related to these terms, you can reach us by phone at <a href="tel:+359899771972">+359 899 771 972</a> or by email at <a href="mailto:office@nexus-cleaning.com">office@nexus-cleaning.com</a>.</p>
